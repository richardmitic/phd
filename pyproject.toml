[project]
name = "phd"
version = "0.1.0"
description = "Monorepo for all PhD work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyterlab",
    "jupyter_tikz",
    "numpy",
    "seaborn",
    "pandas",
    "matplotlib",
    "requests_cache",
    "requests",
    "scikit-learn",
    "statsmodels",
    "segno",
    "typer",
    "sofar",
    "pyfar",
    "librosa",
    "python_auditory_toolbox",
    "matplot2tikz",
]

[tool.uv.sources]
jupyter_tikz = { git = "https://github.com/lucaslrodri/jupyter-tikz", branch = "main" }

[dependency-groups]
dev = [
  "pytest"
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["code"]