[project]
name = "phd"
version = "0.1.0"
description = "Monorepo for all PhD work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab",
    "jupyter_tikz",
    "numpy",
    "scipy>=1.18",
    "seaborn",
    "pandas",
    "matplotlib",
    "requests_cache",
    "requests",
    "scikit-learn",
    "statsmodels",
    "segno",
    "typer",
    "sofar",
    "pyfar",
    "librosa",
    "python_auditory_toolbox",
    "matplot2tikz",
    "rdp",
    "celery",
    "redis",
    "tqdm",
    "cache_to_disk",
    "openpyxl",
    "scikit_posthocs",
    "pyloudnorm",
]

[tool.uv.sources]
jupyter_tikz = { git = "https://github.com/lucaslrodri/jupyter-tikz", branch = "main" }

[dependency-groups]
dev = [
  "pytest",
  "marimo",
  "ruff>=0.16.8",
]

[tool.marimo.runtime]
pythonpath = ["code"]

[tool.pytest]
pythonpath = ["code"]